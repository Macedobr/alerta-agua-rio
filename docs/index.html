<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alerta Água RJ</title>
<style>
  :root{
    --bg:#0a1120; --card:#121c2e; --card2:#16223a; --linha:#233450;
    --txt:#e8eefc; --dim:#8aa0c4; --azul:#38bdf8; --verde:#34d399;
    --ambar:#fbbf24; --vermelho:#f87171;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:radial-gradient(1200px 600px at 20% -10%, #132844 0%, var(--bg) 55%);
    color:var(--txt); font:15px/1.5 "Segoe UI",system-ui,-apple-system,sans-serif;
    min-height:100vh;
  }
  header{
    position:sticky; top:0; z-index:5; backdrop-filter:blur(10px);
    background:rgba(10,17,32,.82); border-bottom:1px solid var(--linha);
    padding:14px 20px; display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  }
  .brand{display:flex; align-items:center; gap:12px; margin-right:auto}
  .drop{
    width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:22px;
    background:linear-gradient(160deg,#0ea5e9,#1d4ed8); box-shadow:0 6px 20px rgba(14,165,233,.35);
  }
  h1{font-size:18px;margin:0;letter-spacing:.2px}
  .brand p{margin:0;color:var(--dim);font-size:12px}
  .pill{
    display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;
    background:var(--card2); border:1px solid var(--linha); font-size:12.5px; color:var(--dim);
  }
  .dot{width:8px;height:8px;border-radius:50%;background:var(--ambar);box-shadow:0 0 0 3px rgba(251,191,36,.15)}
  .dot.on{background:var(--verde);box-shadow:0 0 0 3px rgba(52,211,153,.18)}
  .dot.off{background:var(--vermelho);box-shadow:0 0 0 3px rgba(248,113,113,.18)}
  main{max-width:980px;margin:0 auto;padding:20px}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
  .filtros{display:flex;gap:6px;flex-wrap:wrap}
  .filtros button{
    background:var(--card); color:var(--dim); border:1px solid var(--linha);
    padding:7px 13px; border-radius:999px; cursor:pointer; font-size:13px; transition:.15s;
  }
  .filtros button:hover{color:var(--txt);border-color:#33507d}
  .filtros button.on{background:#0b3a5c;color:#bfe9ff;border-color:#1e6f9f}
  input#busca{
    flex:1; min-width:180px; background:var(--card); border:1px solid var(--linha);
    color:var(--txt); padding:8px 12px; border-radius:10px; outline:none; font-size:14px;
  }
  input#busca:focus{border-color:#2a6fa8}
  .lista{display:flex;flex-direction:column;gap:10px}
  .card{
    background:linear-gradient(180deg,var(--card),#0f1829);
    border:1px solid var(--linha); border-left:3px solid #2b4a72;
    border-radius:14px; padding:14px 16px; transition:.15s;
  }
  .card:hover{border-color:#33507d;transform:translateY(-1px)}
  .card.s80{border-left-color:var(--vermelho)}
  .card.s65{border-left-color:var(--ambar)}
  .card.s45{border-left-color:var(--azul)}
  .topo{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
  .fonte{font-size:12px;color:var(--azul);font-weight:600}
  .quando{font-size:12px;color:var(--dim)}
  .score{
    margin-left:auto;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;
    background:#0b2b45;color:#8fd6ff;border:1px solid #164a6e;
  }
  .card.s80 .score{background:#3b1116;color:#ffb4b4;border-color:#7f2430}
  .card.s65 .score{background:#3b2c0d;color:#ffdf9e;border-color:#7a5a17}
  h2{font-size:15.5px;margin:0 0 6px;font-weight:600;line-height:1.35}
  h2 a{color:var(--txt);text-decoration:none}
  h2 a:hover{color:var(--azul);text-decoration:underline}
  .resumo{
    margin:6px 0 0;color:#a9bcd8;font-size:13.5px;line-height:1.45;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .tag{font-size:11px;padding:2px 8px;border-radius:6px;background:#0e2a44;color:#93cdf2;border:1px solid #18456b}
  .tag.sc{background:#3a1220;color:#ffb3c8;border-color:#6d2338}
  .tag.zo{background:#3a2a10;color:#ffd79a;border-color:#6d4f1e}
  .tag.gd{background:#1a2f14;color:#b6f0a8;border-color:#2f5a26}
  .vazio{text-align:center;color:var(--dim);padding:60px 20px}
  footer{max-width:980px;margin:10px auto 40px;padding:0 20px;color:var(--dim);font-size:12px}
  .erro{color:#ffb4b4}
  @media(max-width:560px){h1{font-size:16px}.score{margin-left:0}}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="drop">💧</div>
    <div>
      <h1>Alerta Água RJ</h1>
      <p>abastecimento · Santa Cruz e Zona Oeste em prioridade</p>
    </div>
  </div>
  <div class="pill"><span class="dot" id="dot"></span><span id="resumo">carregando…</span></div>
</header>

<main>
  <div class="toolbar">
    <div class="filtros" id="filtros">
      <button data-f="todos" class="on">Tudo</button>
      <button data-f="santa">Santa Cruz</button>
      <button data-f="oeste">Zona Oeste</button>
      <button data-f="guandu">Guandu</button>
      <button data-f="alertados">Alertados</button>
    </div>
    <input id="busca" placeholder="filtrar por palavra-chave…" autocomplete="off">
  </div>
  <div class="lista" id="lista"></div>
</main>

<!-- DADOS -->
<script>
const estado = { filtro: "todos", busca: "", itens: [], status: null };
const ESTATICO = typeof window.DADOS !== "undefined";

function esc(s){
  return (s||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function rel(iso){
  if(!iso) return "";
  const d = new Date(iso);
  const s = (Date.now() - d.getTime())/1000;
  if(s < 60) return "agora";
  if(s < 3600) return Math.floor(s/60)+" min atrás";
  if(s < 86400) return Math.floor(s/3600)+" h atrás";
  return Math.floor(s/86400)+" d atrás";
}
function abs(iso){
  if(!iso) return "";
  const d = new Date(iso);
  return d.toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
}

function classeScore(s){
  if(s >= 80) return "s80";
  if(s >= 65) return "s65";
  if(s >= 45) return "s45";
  return "";
}

function resumoUtil(it){
  const r = (it.resumo||"").trim();
  if(r.length < 40) return "";
  const t = (it.titulo||"").toLowerCase().slice(0, 50);
  if(t && r.toLowerCase().startsWith(t)) return "";
  return r;
}

function card(it){
  const tags = (it.tags||"").split(",").filter(Boolean);
  const chips = tags.map(t=>{
    const cls = t === "Santa Cruz" ? "sc" : t === "Zona Oeste" ? "zo" : t === "Guandu" ? "gd" : "";
    return `<span class="tag ${cls}">${esc(t)}</span>`;
  }).join("");
  const outros = (it.duplicados||0) > 0
    ? `<span class="tag" title="${esc((it.fontes||[]).join(', '))}">+${it.duplicados} veículo${it.duplicados>1?"s":""}</span>`
    : "";
  const resumo = resumoUtil(it);
  return `<article class="card ${classeScore(it.score)}">
    <div class="topo">
      <span class="fonte">${esc(it.fonte)}</span>
      <span class="quando" title="${esc(abs(it.publicado))}">${esc(rel(it.publicado))}</span>
      <span class="score">${it.score}</span>
    </div>
    <h2><a href="${esc(it.link)}" target="_blank" rel="noopener">${esc(it.titulo)}</a></h2>
    ${resumo ? `<p class="resumo">${esc(resumo)}</p>` : ""}
    ${(chips || outros) ? `<div class="tags">${chips}${outros}</div>` : ""}
  </article>`;
}

function combina(it, filtro){
  const tags = it.tags || "";
  if(filtro === "santa") return tags.indexOf("Santa Cruz") >= 0;
  if(filtro === "oeste") return tags.indexOf("Zona Oeste") >= 0;
  if(filtro === "guandu") return tags.indexOf("Guandu") >= 0;
  if(filtro === "alertados") return it.alertado == 1;
  return true;
}

function render(){
  const q = estado.busca.trim().toLowerCase();
  const itens = estado.itens.filter(it =>
    combina(it, estado.filtro) &&
    (!q || (it.titulo||"").toLowerCase().includes(q) || (it.fonte||"").toLowerCase().includes(q)));
  const alvo = document.getElementById("lista");
  if(!itens.length){
    alvo.innerHTML = `<div class="vazio">Nenhuma notícia${q ? " para essa busca" : " ainda"}.</div>`;
  } else {
    alvo.innerHTML = itens.map(card).join("");
  }
}

function renderStatus(st){
  estado.status = st;
  const dot = document.getElementById("dot");
  const tg = st.telegram ? "Telegram ativo" : "Telegram não configurado";
  let linha;

  if(st.estatico){
    dot.className = "dot on";
    linha = `Atualizado ${rel(st.gerado_em)} · ${tg}`;
  } else {
    const okFontes = (st.fontes||[]).filter(f=>f.ok).length;
    const totalFontes = (st.fontes||[]).length;
    dot.className = "dot " + (st.ativo ? (okFontes ? "on" : "off") : "off");
    linha = `${st.ativo ? "Monitorando" : "Parado"} · ${okFontes}/${totalFontes} fontes · ${tg}`;
  }
  document.getElementById("resumo").textContent = linha;

  const t = st.totais || {};
  const quando = st.estatico
    ? `Atualizado em ${esc(abs(st.gerado_em))}`
    : `Última checagem: ${esc(rel(st.ultimo_ciclo))}`;
  const nota = st.estatico
    ? "página gerada automaticamente na nuvem"
    : "painel atualiza sozinho a cada 60 s";
  document.getElementById("rodape").innerHTML =
    `${quando} · ${t.total||0} notícias no histórico · ${t.alertados||0} alertas enviados · ${nota}`;
}

async function carregar(){
  if(ESTATICO){
    estado.itens = (window.DADOS && window.DADOS.itens) || [];
    renderStatus((window.DADOS && window.DADOS.status) || {});
    render();
    return;
  }
  try{
    const r = await fetch("/api/itens?limite=400", {cache:"no-store"});
    const dados = await r.json();
    estado.itens = dados.itens || [];
    renderStatus(dados.status || {});
    render();
  }catch(e){
    document.getElementById("rodape").innerHTML = `<span class="erro">Sem conexão com o monitor (${esc(e.message)}).</span>`;
  }
}

document.getElementById("filtros").addEventListener("click", ev=>{
  const b = ev.target.closest("button");
  if(!b) return;
  document.querySelectorAll("#filtros button").forEach(x=>x.classList.toggle("on", x===b));
  estado.filtro = b.dataset.f;
  render();
});
document.getElementById("busca").addEventListener("input", ev=>{
  estado.busca = ev.target.value; render();
});

carregar();
if(!ESTATICO) setInterval(carregar, 60000);
</script>
